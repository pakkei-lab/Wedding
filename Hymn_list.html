<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6f2137"><title>Patrick & Becky 婚禮聖詩 Demo</title><style>
:root{--wine:#6f2137;--rose:#a7586c;--gold:#b99555;--cream:#fbf7f1;--ink:#302a2b;--muted:#756b6d;--card:#fff;--line:#eadfd9;--ok:#477351;--warn:#9b6b21}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;background:linear-gradient(160deg,#f9f1eb,#fff 42%,#f7eee9);color:var(--ink)}header{padding:calc(30px + env(safe-area-inset-top)) 20px 22px;background:linear-gradient(135deg,#5a172b,#8b3049);color:#fff;position:relative;overflow:hidden}header:after{content:"✦";position:absolute;right:18px;top:8px;font-size:100px;color:#ffffff12}.eyebrow{font-size:12px;letter-spacing:.18em;color:#ead3a1}.hero{max-width:900px;margin:auto}h1{margin:7px 0 6px;font-family:Georgia,"Noto Serif TC",serif;font-size:clamp(26px,7vw,42px)}header p{margin:0;color:#f1dfe4}.toolbar{position:sticky;top:0;z-index:10;padding:12px 14px;background:#fbf7f1e8;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.toolbar-inner{max-width:900px;margin:auto;display:grid;grid-template-columns:1fr auto;gap:9px}.search{width:100%;border:1px solid #decfc9;background:white;border-radius:14px;padding:12px 14px;font-size:16px;outline:none}.filter{border:0;border-radius:14px;padding:0 14px;background:var(--wine);color:#fff;font-weight:700}main{max-width:900px;margin:auto;padding:18px 14px 90px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:15px}.stat{background:#ffffffc9;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:20px;color:var(--wine)}.stat span{font-size:12px;color:var(--muted)}.notice{font-size:13px;line-height:1.55;color:#705b4b;background:#fff8e9;border:1px solid #efd9aa;border-radius:14px;padding:11px 13px;margin-bottom:14px}.list{display:grid;gap:11px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 5px 18px #51202b0b}.top{display:flex;gap:12px;align-items:flex-start}.num{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#f3e7e8;color:var(--wine);font-weight:800}.info{min-width:0;flex:1}.title{margin:0;font-size:17px;line-height:1.3}.meta{margin-top:5px;display:flex;gap:6px;flex-wrap:wrap}.pill{font-size:11px;padding:4px 7px;border-radius:99px;background:#f7f0eb;color:#745c59}.pill.warn{background:#fff3d7;color:var(--warn)}.pill.ok{background:#eaf4eb;color:var(--ok)}.hymnno{font-size:12px;color:var(--muted);white-space:nowrap}.actions{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:13px}.btn{border:0;border-radius:11px;padding:10px 9px;font-weight:750;font-size:14px;text-align:center;text-decoration:none;cursor:pointer}.play{background:var(--wine);color:#fff}.yt{background:#f5e9ea;color:var(--wine)}.pick{width:42px;background:#f3eee9;color:#9a8580;font-size:18px}.pick.on{background:#fff0bd;color:#9b6b21}.notes{width:100%;margin-top:10px;border:1px dashed #dbc9c2;border-radius:10px;padding:9px;font:inherit;font-size:13px;resize:vertical;min-height:38px}.empty{text-align:center;color:var(--muted);padding:40px}footer{text-align:center;color:#87787a;font-size:12px;padding:20px}.modal{display:none;position:fixed;inset:0;background:#12080ccc;z-index:30;padding:5vh 14px;align-items:center;justify-content:center}.modal.open{display:flex}.modal-box{width:min(900px,100%);background:#171214;border-radius:18px;overflow:hidden}.modal-head{padding:11px 13px;color:white;display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#ffffff22;color:white;border-radius:9px;padding:7px 10px}.video{aspect-ratio:16/9}.video iframe{width:100%;height:100%;border:0}.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));background:var(--gold);color:#fff;border:0;border-radius:50%;width:52px;height:52px;font-size:23px;box-shadow:0 7px 20px #0003}@media(min-width:700px){.list{grid-template-columns:1fr 1fr}.toolbar-inner{grid-template-columns:1fr 130px}}
</style></head><body><header><div class="hero"><div class="eyebrow">WEDDING CEREMONY MUSIC</div><h1>Patrick & Becky 婚禮聖詩 Demo</h1><p>共 17 首候選詩歌，附 YouTube 試聽及選歌筆記</p></div></header><div class="toolbar"><div class="toolbar-inner"><input id="q" class="search" placeholder="搜尋歌名或編號…"><button id="filter" class="filter">只看已選</button></div></div><main><section class="summary"><div class="stat"><b id="total">17</b><span>候選詩歌</span></div><div class="stat"><b id="picked">0</b><span>已選</span></div><div class="stat"><b>17</b><span>YouTube Demo</span></div></section><div class="notice">Demo 以網上可找到的相同歌名或常見版本整理。標示「版本待確認」的項目可能有不同曲調，正式選曲前請與教會或詩班核對 Hymn No. 及樂譜版本。</div><section id="list" class="list"></section><div id="empty" class="empty" hidden>沒有符合的項目</div></main><footer>Wedding hymn shortlist • 資料及筆記只儲存在此瀏覽器</footer><button class="fab" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="回到頂部">↑</button><div id="modal" class="modal"><div class="modal-box"><div class="modal-head"><span id="modalTitle"></span><button class="close" onclick="closeVideo()">關閉</button></div><div class="video"><iframe id="player" allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div></div></div><script>
const songs=[
[1,'All Things Bright & Beautiful','519/519A','k5f7gPjTViQ','合唱／傳統',''],
[2,'Cherubim Song','522','KhbuNZ8p3hg','聖樂合唱','版本待確認'],
[3,'For The Beauty of The Earth','680','agX7UAY5SxM','合唱／感恩',''],
[4,'I Want to Thank You, Jesus','477','MMbPz8IAi_g','感恩敬拜','版本待確認'],
[5,'In Moments Like These','669','r7eKopaLuAw','安靜敬拜',''],
[6,'As a Bridegroom To His Chosen','418','sTFp9Mjzppc','John Rutter／婚禮',''],
[7,'Look At the World','150','otw_zbhd3gE','John Rutter／合唱',''],
[8,'Praise Ye The Lord','638','cbA8prdCKOc','歡欣讚美','版本待確認'],
[9,'Thanks Be To God','511','InqtPK46tRI','感恩聖詩','版本待確認'],
[10,'The Greatest of These Is Love','182','yffXAFNCPe4','婚禮／哥林多前書13章',''],
[11,'The Lord Bless You and Keep You','763','QcYzO8Y4PH0','John Rutter／祝福',''],
[12,'The Lord Is My Light','681','r2g-zhgoAJk','信靠／詩篇27篇','版本待確認'],
[13,'The Lord Is My Shepherd','719','_tC3ED8RY7I','詩篇23篇','版本待確認'],
[14,'應許之歌','1231','TSgRdL56Iaw','中文聖詩／盼望','版本待確認'],
[15,'詩篇第23篇（楊伯倫）','1136','oZNxdDzCIxI','中文合唱／詩篇23篇',''],
[16,'Walk Hand In Hand','191','vphGVqdVgdE','婚禮退場詩歌','版本待確認'],
[17,'恩典之路','1284','YaJ5gof0YNQ','讚美之泉／中文敬拜','官方歌詞版']];
let onlyPicked=false;const picked=new Set(JSON.parse(localStorage.getItem('hymnPicked')||'[]'));const notes=JSON.parse(localStorage.getItem('hymnNotes')||'{}');
function render(){const term=document.querySelector('#q').value.trim().toLowerCase();const list=document.querySelector('#list');list.innerHTML='';const filtered=songs.filter(s=>(!onlyPicked||picked.has(s[0]))&&(`${s[0]} ${s[1]} ${s[2]} ${s[4]}`).toLowerCase().includes(term));document.querySelector('#empty').hidden=filtered.length>0;filtered.forEach(s=>{const [n,title,no,id,tag,status]=s;const el=document.createElement('article');el.className='card';el.innerHTML=`<div class="top"><div class="num">${n}</div><div class="info"><h2 class="title">${title}</h2><div class="meta"><span class="pill">${tag}</span>${status?`<span class="pill ${status.includes('官方')?'ok':'warn'}">${status}</span>`:''}</div></div><div class="hymnno">Hymn No.<br><b>${no}</b></div></div><div class="actions"><button class="btn play" onclick="play('${id}',${JSON.stringify(title)})">▶ 網頁試聽</button><a class="btn yt" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=${id}">YouTube ↗</a><button class="btn pick ${picked.has(n)?'on':''}" onclick="togglePick(${n})" aria-label="加入選歌">★</button></div><textarea class="notes" placeholder="加入用途、調性、詩班或婚禮流程筆記…" oninput="saveNote(${n},this.value)">${notes[n]||''}</textarea>`;list.appendChild(el)});document.querySelector('#picked').textContent=picked.size;localStorage.setItem('hymnPicked',JSON.stringify([...picked]));}
function togglePick(n){picked.has(n)?picked.delete(n):picked.add(n);render()}function saveNote(n,v){notes[n]=v;localStorage.setItem('hymnNotes',JSON.stringify(notes))}function play(id,title){document.querySelector('#modalTitle').textContent=title;document.querySelector('#player').src=`https://www.youtube-nocookie.com/embed/${id}?autoplay=1`;document.querySelector('#modal').classList.add('open')}function closeVideo(){document.querySelector('#modal').classList.remove('open');document.querySelector('#player').src=''}document.querySelector('#q').addEventListener('input',render);document.querySelector('#filter').onclick=e=>{onlyPicked=!onlyPicked;e.currentTarget.textContent=onlyPicked?'顯示全部':'只看已選';render()};document.querySelector('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeVideo()});render();
</script></body></html>
